[project]
name = "specripple"
version = "0.2.0"
description = "Change-driven multi-artifact alignment for AI coding agents (deterministic core CLI)."
readme = "README.zh-CN.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
specripple = "specripple.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specripple"]

# The host installer bundles the runtime from the installed package when no
# source checkout is available, so the wheel must ship the runtime's build
# inputs (see skillbuild.REQUIRED_RUNTIME_FILES) as package data.
[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "specripple/_runtime_src/pyproject.toml"
"uv.lock" = "specripple/_runtime_src/uv.lock"
"README.zh-CN.md" = "specripple/_runtime_src/README.zh-CN.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = [
    "slow: builds a wheel and a fresh venv end to end (deselect with -m 'not slow')",
]
